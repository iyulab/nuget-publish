name: publish
# Quoted on purpose: an unquoted " #" starts a YAML comment and would cut the name short. request.yml finds its run by this title.
run-name: 'publish ${{ inputs.source-repo }} #${{ inputs.run-id }}.${{ inputs.run-attempt }}'

# The one place that pushes to nuget.org. A package repository builds its .nupkg, uploads it as an
# artifact and asks this workflow (through request.yml) to publish it; the trusted-publishing
# policies on nuget.org name THIS repository and THIS file, so no repository holds a NuGet key.
#
# Why not a reusable workflow that package repositories call: nuget.org checks both the `repository`
# claim and the `job_workflow_ref` claim against the policy, and a reusable workflow splits them
# (caller vs. callee), so no single policy can match. The push has to run here.
#
# Two policies exist, one per nuget.org package owner, told apart by the environment claim:
#   environment `release`          -> packages owned by iyulab-rnd
#   environment `release-iyulab`   -> packages owned by iyulab
# (a token matches the oldest matching policy, so the two must differ by environment).
# Both environments only accept the main branch.

on:
  workflow_dispatch:
    inputs:
      source-repo:
        description: The repository that built the packages, as iyulab/<name> (must be in the PUBLISHERS allowlist)
        required: true
        type: string
      run-id:
        description: The run of that repository's workflow that uploaded the artifact
        required: true
        type: string
      run-attempt:
        description: Attempt of that run; only makes the run name unique, so request.yml can find its own run after a re-run
        required: false
        type: string
        default: '1'
      artifact:
        description: Name of the artifact holding the .nupkg (and .snupkg) files
        required: false
        type: string
        default: nuget-packages

permissions: {}

concurrency:
  group: publish-${{ inputs.source-repo }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      owner: ${{ steps.plan.outputs.owner }}
      name: ${{ steps.plan.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        name: Check the source repository against the allowlist
        env:
          SOURCE_REPO: ${{ inputs.source-repo }}
          PUBLISHERS: ${{ vars.PUBLISHERS }}
        run: python3 scripts/guard.py plan

  publish:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Selects the policy: owner iyulab -> release-iyulab, anything else (iyulab-rnd) -> release.
    environment: ${{ needs.plan.outputs.owner == 'iyulab' && 'release-iyulab' || 'release' }}
    permissions:
      id-token: write   # the OIDC token NuGet/login exchanges for a short-lived API key
      contents: read
    env:
      SOURCE_REPO: ${{ inputs.source-repo }}
      RUN_ID: ${{ inputs.run-id }}
      PUBLISHERS: ${{ vars.PUBLISHERS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: token
        name: Mint a read-only token for the source repository
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ needs.plan.outputs.name }}
          permission-actions: read
          permission-metadata: read

      - name: Check the source run
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: python3 scripts/guard.py run

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: in
          repository: ${{ inputs.source-repo }}
          run-id: ${{ inputs.run-id }}
          github-token: ${{ steps.token.outputs.token }}

      - name: Check the packages against the allowlist
        run: python3 scripts/guard.py packages in

      # Asked for right before the push: the key lives one hour and a token buys exactly one key.
      - id: login
        name: NuGet login (OIDC to a short-lived API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          # A .snupkg next to its .nupkg is pushed by the same command.
          find in -name '*.nupkg' -print0 | while IFS= read -r -d '' package; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
